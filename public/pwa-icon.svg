<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0314" />
      <stop offset="50%" stop-color="#190a33" />
      <stop offset="100%" stop-color="#05010a" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonPurple)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Ambient Cinematic Glow Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#neonPurple)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 6" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#accentCyan)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Clapperboard Body (Safe-Zone Center) -->
  <g filter="url(#neonGlow)">
    <!-- Clapperboard Slate Base -->
    <rect x="136" y="210" width="240" height="175" rx="18" fill="#130826" stroke="url(#neonPurple)" stroke-width="4" />
    
    <!-- Film Slate Dividing Grid Lines -->
    <line x1="136" y1="280" x2="376" y2="280" stroke="url(#neonPurple)" stroke-width="2.5" stroke-opacity="0.4" />
    <line x1="256" y1="280" x2="256" y2="385" stroke="url(#neonPurple)" stroke-width="2.5" stroke-opacity="0.4" />

    <!-- Clapperboard Angled Top Arm -->
    <g transform="rotate(-12 140 180)">
      <rect x="136" y="152" width="244" height="48" rx="10" fill="#1e0b3c" stroke="url(#neonPurple)" stroke-width="3.5" />
      <!-- Chevrons / Stripes -->
      <path d="M172 154 L196 154 L176 198 L152 198 Z" fill="url(#neonPurple)" />
      <path d="M224 154 L248 154 L228 198 L204 198 Z" fill="url(#neonPurple)" />
      <path d="M276 154 L300 154 L280 198 L256 198 Z" fill="url(#neonPurple)" />
      <path d="M328 154 L352 154 L332 198 L308 198 Z" fill="url(#neonPurple)" />
    </g>

    <!-- Hinge Pin -->
    <circle cx="148" cy="188" r="8" fill="url(#amberGold)" />

    <!-- Center Play/Scene Icon -->
    <polygon points="246,314 278,332 246,350" fill="url(#amberGold)" />
  </g>

  <!-- Title Monogram Text -->
  <text x="256" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">SCENESWAP</text>
  <text x="196" y="340" font-family="monospace" font-size="12" font-weight="700" fill="#a855f7" text-anchor="middle">SCENE 1</text>
  <text x="316" y="340" font-family="monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">TAKE 1</text>

  <!-- Ambient Accent Sparkles -->
  <polygon points="120,130 125,142 137,147 125,152 120,164 115,152 103,147 115,142" fill="url(#amberGold)" />
  <polygon points="395,135 399,145 409,149 399,153 395,163 391,153 381,149 391,145" fill="url(#accentCyan)" />
  <polygon points="380,390 384,398 392,401 384,404 380,412 376,404 368,401 376,398" fill="url(#amberGold)" />
</svg>