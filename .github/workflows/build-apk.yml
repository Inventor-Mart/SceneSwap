name: Build SceneSwap Android APK (Android 7+)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Android 7.0+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/SceneSwap-Android7plus-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SceneSwap-Android7plus-v1.0.apk
          path: release-output/SceneSwap-Android7plus-v1.0.apk
          retention-days: 90

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: SceneSwap v1.0.0 APK (Android 7.0+)
          body: |
            ## 🎬 SceneSwap Android App (v1.0.0)
            
            This APK is compiled with `minSdkVersion = 24`, supporting **any Android phone running Android 7.0 (Nougat) and upwards** (Android 7 through Android 15+).
            
            ### What's Inside:
            - Full interactive party lobby (2–5 players) with custom avatar photos
            - 8 Cinematic genres with dynamic screenplay generation
            - Gen Z party soundboard & audio FX deck (Vine Boom, Sting, Scratch, Boing, Thunder, Cheer)
            - Dual performance modes: Graphic Novel Stage & TikTok/Reels Studio Script
            - Live 3-act choice voting and branching story progression
            
            ### Installation:
            1. Download `SceneSwap-Android7plus-v1.0.apk` below directly on your Android phone.
            2. Tap the downloaded file to install (allow "Install from unknown sources" if prompted by Chrome or Files).
            3. Enjoy SceneSwap!
          files: release-output/SceneSwap-Android7plus-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
